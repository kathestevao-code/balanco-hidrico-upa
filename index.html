<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Balanço Hídrico UPA 24 Horas</title>
  <style>
    :root{--green:#009c4b;--blue:#087cc1;--red:#ed1c24;--ink:#064e73;--bg:#f3f8fb;--line:#d6e6ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;background:#fff;border-top:5px solid var(--green);border-bottom:1px solid var(--line)}header b{font:700 22px Georgia,serif}header small{display:block;color:#6b8290;margin-top:3px}.upa{font-size:28px;font-weight:900;color:var(--green)}.upa i{color:var(--blue);font-style:normal}.wrap{max-width:1150px;margin:auto;padding:26px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 7px 25px #154c6010;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1,.card h2{font-family:Georgia,serif;margin:2px 0}.head small{color:var(--green);font-weight:bold;text-transform:uppercase}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer}.new{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-top:16px;padding:14px;background:#edf7f2;border-radius:13px}input,select{width:100%;height:44px;padding:0 12px;border:1px solid #c9dadd;border-radius:10px;background:#fff;font:inherit}label{display:block;font-size:12px;font-weight:bold}label span{display:block;margin-bottom:6px}.patients{display:flex;gap:9px;overflow:auto;margin-top:15px}.patient{min-width:205px;text-align:left;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.patient.active{border:2px solid var(--green);background:#eef9f2}.patient small{display:block;color:#718793;margin-top:3px}.selected{display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff}.selected strong{font-family:Georgia,serif;font-size:18px}.selected span{margin-left:auto;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat small{display:block;color:#718793}.stat b{font-size:26px}.stat.balance{background:var(--blue);color:#fff}.workspace{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.tabs button{padding:11px;border:0;border-radius:9px;font-weight:bold}.tabs .on{background:#e4f6eb;color:var(--green)}.tabs .out.on{background:#ffeaeb;color:var(--red)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.records{max-height:390px;overflow:auto}.record{display:grid;grid-template-columns:1fr auto 25px;gap:10px;padding:12px 0;border-bottom:1px solid #e5eeee}.record small{display:block;color:#718793}.record .entrada{color:var(--green)}.record .saida{color:var(--red)}.record button{border:0;background:none;font-size:20px}.actions{display:flex;gap:7px}.danger{background:#ffeaeb;color:var(--red)}.empty{text-align:center;color:#718793;padding:55px 10px}.info p,.info li{color:#5f7680;line-height:1.6;font-size:13px}footer{text-align:center;color:#6b8290;font-size:11px;padding:20px;border-top:1px solid var(--line)}footer b{color:var(--blue)}@media(max-width:750px){.workspace{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}.new{grid-template-columns:1fr 1fr}.new button{grid-column:1/-1}}@media(max-width:440px){header b{font-size:17px}.upa{font-size:21px}.head{align-items:flex-start}.new{grid-template-columns:1fr}.new button{grid-column:auto}.row{grid-template-columns:1fr}.stats .stat b{font-size:20px}}
    .guide-intro{margin-bottom:16px}.formula{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0;padding:15px;border-radius:12px;background:linear-gradient(90deg,#e4f6eb,#e5f3fb)}.formula span{padding:7px 11px;border-radius:8px;background:#fff;font-weight:bold}.formula b{color:var(--green);font-size:18px}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.info-box{padding:17px;border:1px solid var(--line);border-radius:13px;background:#fbfdfd}.info-box h3{margin:0 0 8px;font:700 17px Georgia,serif}.info-box p,.info-box li{font-size:12px;line-height:1.55;color:#5f7680}.info-box ul{margin:0;padding-left:18px}.alert{margin-top:13px;padding:13px;border-left:4px solid #f2c300;border-radius:8px;background:#fff9dc;color:#66591d;font-size:12px;line-height:1.5}@media(max-width:750px){.info-grid{grid-template-columns:1fr}}
    .auto-calc{margin:-2px 0 16px;padding:11px 14px;border:1px solid #b9dcc7;border-radius:11px;background:#eef9f2;color:#35624a;font-size:12px;text-align:center}.auto-calc b{color:var(--green)}
  </style>
</head>
<body>
<header><div><b>Balanço Hídrico UPA 24 Horas</b><small>Rondonópolis · Controle de entradas e saídas</small></div><div class="upa">UPA <i>24h</i></div></header>
<main class="wrap">
  <section class="card"><div class="head"><div><small>Pacientes internados</small><h1>Selecione o paciente</h1></div><button class="btn" onclick="toggleForm()">+ Novo paciente</button></div>
    <form class="new" id="newForm" onsubmit="addPatient(event)"><label><span>Nome do paciente</span><input id="name" required placeholder="Nome completo"></label><label><span>Leito</span><input id="bed" required placeholder="Ex.: 12A"></label><button class="btn">Adicionar paciente</button></form><div class="patients" id="patients"></div>
  </section>
  <div id="app"></div>
</main>
<footer>Feito por <b>Kathleen Gabrielly de Souza Estevão</b> · AC – Universidade Federal de Rondonópolis</footer>
<script>
let patients=JSON.parse(localStorage.getItem('balanco-pacientes')||'[]'),active=patients[0]?.id||null,type='entrada';
const cats={entrada:['Via oral','Soro/EV','Dieta enteral','Medicação','Outros'],saida:['Diurese','Dreno','Vômito','Fezes líquidas','Outros']};
const save=()=>localStorage.setItem('balanco-pacientes',JSON.stringify(patients));
function toggleForm(){const f=document.getElementById('newForm');f.style.display=f.style.display==='none'?'grid':'none'}
function addPatient(e){e.preventDefault();const p={id:Date.now(),nome:name.value.trim(),leito:bed.value.trim(),registros:[]};patients.push(p);active=p.id;name.value='';bed.value='';save();render()}
function selectPatient(id){active=id;render()}
function removePatient(){const p=current();if(!p||!confirm('Remover '+p.nome+' e todos os registros?'))return;patients=patients.filter(x=>x.id!==active);active=patients[0]?.id||null;save();render()}
function current(){return patients.find(p=>p.id===active)}
function setType(t){type=t;render()}
function addRecord(e){e.preventDefault();const p=current(),v=Number(document.getElementById('volume').value.replace(',','.'));if(!p||!v||v<=0)return;const time=document.getElementById('time').value,now=new Date(),parts=time.split(':');now.setHours(+parts[0],+parts[1],0,0);p.registros.unshift({id:Date.now(),dataHora:now.toISOString(),horario:time,tipo:type,categoria:document.getElementById('category').value,volume:v});save();render()}
function delRecord(id){const p=current();p.registros=p.registros.filter(r=>r.id!==id);save();render()}
function clearRecords(){if(confirm('Limpar todos os registros deste paciente?')){current().registros=[];save();render()}}
function crc32(data){let c=-1;for(const b of data){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}
function u16(n){return new Uint8Array([n&255,n>>>8&255])}function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}
function join(parts){let n=parts.reduce((s,p)=>s+p.length,0),out=new Uint8Array(n),o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function zip(files){const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;for(const [name,text] of Object.entries(files)){const nb=enc.encode(name),db=enc.encode(text),crc=crc32(db),local=join([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(db.length),u32(db.length),u16(nb.length),u16(0),nb,db]);locals.push(local);centrals.push(join([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(db.length),u32(db.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nb]));offset+=local.length}const cd=join(centrals);return join([...locals,cd,u32(0x06054b50),u16(0),u16(0),u16(centrals.length),u16(centrals.length),u32(cd.length),u32(offset),u16(0)])}
function download(){const p=current(),lim=Date.now()-43200000,rs=p.registros.filter(r=>new Date(r.dataHora).getTime()>=lim).slice().reverse(),esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),cell=(r,v,s=0,num=false)=>num?`<c r="${r}" s="${s}"><v>${v}</v></c>`:`<c r="${r}" s="${s}" t="inlineStr"><is><t>${esc(v)}</t></is></c>`;let rows=rs.map((r,i)=>{let n=i+7;return `<row r="${n}">${cell('A'+n,new Date(r.dataHora).toLocaleDateString('pt-BR'),3)}${cell('B'+n,r.horario,3)}${cell('C'+n,r.tipo==='entrada'?'ENTRADA':'SAÍDA',r.tipo==='entrada'?4:5)}${cell('D'+n,r.categoria,3)}${cell('E'+n,r.volume,6,true)}</row>`}).join(''),last=Math.max(7,rs.length+6),t1=last+2,t2=last+3,t3=last+4,sheet=`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><cols><col min="1" max="1" width="20" customWidth="1"/><col min="2" max="2" width="16" customWidth="1"/><col min="3" max="3" width="18" customWidth="1"/><col min="4" max="4" width="48" customWidth="1"/><col min="5" max="5" width="22" customWidth="1"/></cols><sheetData><row r="1" ht="30">${cell('A1','BALANÇO HÍDRICO UPA 24 HORAS',1)}</row><row r="2">${cell('A2','REGISTRO PARCIAL DE 12 HORAS',2)}</row><row r="4">${cell('A4','PACIENTE',7)}${cell('B4',p.nome,3)}${cell('D4','LEITO',7)}${cell('E4',p.leito,3)}</row><row r="5">${cell('A5','EMITIDO EM',7)}${cell('B5',new Date().toLocaleString('pt-BR'),3)}</row><row r="6">${cell('A6','DATA',2)}${cell('B6','HORÁRIO',2)}${cell('C6','TIPO',2)}${cell('D6','CATEGORIA',2)}${cell('E6','VOLUME (mL)',2)}</row>${rows||`<row r="7">${cell('A7','Sem registros nas últimas 12 horas',3)}</row>`}<row r="${t1}">${cell('D'+t1,'TOTAL DE ENTRADAS',7)}<c r="E${t1}" s="8"><f>SUMIF(C7:C${last},"ENTRADA",E7:E${last})</f><v>0</v></c></row><row r="${t2}">${cell('D'+t2,'TOTAL DE SAÍDAS',7)}<c r="E${t2}" s="8"><f>SUMIF(C7:C${last},"SAÍDA",E7:E${last})</f><v>0</v></c></row><row r="${t3}">${cell('D'+t3,'SALDO HÍDRICO',9)}<c r="E${t3}" s="9"><f>E${t1}-E${t2}</f><v>0</v></c></row></sheetData><mergeCells count="4"><mergeCell ref="A1:E1"/><mergeCell ref="A2:E2"/><mergeCell ref="B4:C4"/><mergeCell ref="B5:E5"/></mergeCells><printOptions horizontalCentered="1"/><pageMargins left=".18" right=".18" top=".25" bottom=".25" header=".1" footer=".1"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="1"/></worksheet>`,styles=`<?xml version="1.0"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="4"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="18"/><color rgb="FFFFFFFF"/></font><font><b/><color rgb="FFFFFFFF"/></font><font><b/><color rgb="FF064E73"/></font></fonts><fills count="7"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF009C4B"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF087CC1"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE4F6EB"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFEAEB"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF222222"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/></border></borders><cellXfs count="10"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center"/></xf><xf fontId="2" fillId="3" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center"/></xf><xf borderId="1" applyBorder="1"/><xf fontId="3" fillId="4" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf fontId="3" fillId="5" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf borderId="1" numFmtId="3" applyBorder="1" applyNumberFormat="1"/><xf fontId="3" fillId="4" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf fontId="3" fillId="4" borderId="1" numFmtId="3" applyFont="1" applyFill="1" applyBorder="1" applyNumberFormat="1"/><xf fontId="2" fillId="6" borderId="1" numFmtId="3" applyFont="1" applyFill="1" applyBorder="1" applyNumberFormat="1"/></cellXfs></styleSheet>`,files={'[Content_Types].xml':'<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>','_rels/.rels':'<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<?xml version="1.0"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><calcPr calcId="191029" fullCalcOnLoad="1"/><sheets><sheet name="Balanço 12h" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>','xl/styles.xml':styles,'xl/worksheets/sheet1.xml':sheet},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([zip(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='balanco-12h-'+p.nome.replace(/\s+/g,'-')+'.xlsx';a.click()}
function render(){document.getElementById('patients').innerHTML=patients.map(p=>'<button class="patient '+(p.id===active?'active':'')+'" onclick="selectPatient('+p.id+')"><b>'+p.nome+'</b><small>Leito '+p.leito+' · '+p.registros.length+' registros</small></button>').join('');const p=current(),app=document.getElementById('app');if(!p){app.innerHTML='<div class="card empty">Cadastre o primeiro paciente para começar.</div>';return}const en=p.registros.filter(r=>r.tipo==='entrada').reduce((s,r)=>s+r.volume,0),out=p.registros.filter(r=>r.tipo==='saida').reduce((s,r)=>s+r.volume,0),bal=en-out,now=new Date().toTimeString().slice(0,5);app.innerHTML=`
<section class="card selected"><strong>${p.nome}</strong><span>Leito ${p.leito}</span><button class="btn danger" onclick="removePatient()">Remover</button></section>
<section class="stats"><div class="stat"><small>Entradas</small><b>${en.toLocaleString('pt-BR')} mL</b></div><div class="stat"><small>Saídas</small><b>${out.toLocaleString('pt-BR')} mL</b></div><div class="stat balance"><small>Saldo automático</small><b>${bal>0?'+':''}${bal.toLocaleString('pt-BR')} mL</b></div></section><div class="auto-calc">Cálculo automático: <b>Entradas (${en.toLocaleString('pt-BR')} mL) − Saídas (${out.toLocaleString('pt-BR')} mL) = ${bal.toLocaleString('pt-BR')} mL</b></div>
<section class="workspace"><form class="card" onsubmit="addRecord(event)"><h2>Novo registro</h2><label>Tipo</label><div class="tabs"><button type="button" class="${type==='entrada'?'on':''}" onclick="setType('entrada')">↓ Entrada</button><button type="button" class="out ${type==='saida'?'on':''}" onclick="setType('saida')">↑ Saída</button></div><label><span>Categoria</span><select id="category">${cats[type].map(x=>'<option>'+x+'</option>').join('')}</select></label><div class="row"><label><span>Volume (mL)</span><input id="volume" inputmode="decimal" required placeholder="Ex.: 500"></label><label><span>Horário</span><input id="time" type="time" value="${now}"></label></div><button class="btn" style="width:100%;margin-top:17px">Adicionar registro</button></form>
<section class="card"><div class="head"><div><h2>Registros de hoje</h2><small>${p.registros.length} lançamentos</small></div><div class="actions"><button class="btn" onclick="download()">Baixar 12h</button><button class="btn danger" onclick="clearRecords()">Limpar</button></div></div><div class="records">${p.registros.length?p.registros.map(r=>'<div class="record"><div><b>'+r.categoria+'</b><small>'+r.horario+'</small></div><b class="'+r.tipo+'">'+(r.tipo==='entrada'?'+':'−')+r.volume.toLocaleString('pt-BR')+' mL</b><button onclick="delRecord('+r.id+')">×</button></div>').join(''):'<div class="empty">Nenhum registro ainda.</div>'}</div></section></section>
<section class="card info"><div class="guide-intro"><h2>Entenda o balanço hídrico</h2><p>O balanço hídrico é o controle de todos os líquidos administrados e eliminados pelo paciente durante um período determinado. Ele auxilia a equipe na avaliação da hidratação e da resposta ao tratamento.</p></div><div class="formula"><span>Total de entradas</span><b>−</b><span>Total de saídas</span><b>=</b><span>Saldo hídrico</span></div><div class="info-grid"><article class="info-box"><h3>O que registrar?</h3><p><b>Entradas:</b> líquidos por via oral, soros e medicações intravenosas, dieta enteral e outras soluções administradas.</p><p><b>Saídas:</b> diurese, vômitos, drenagens, fezes líquidas e demais perdas mensuráveis.</p></article><article class="info-box"><h3>Como interpretar?</h3><ul><li><b>Saldo positivo:</b> entradas maiores que as saídas.</li><li><b>Saldo negativo:</b> saídas maiores que as entradas.</li><li><b>Saldo zero:</b> volumes de entrada e saída iguais.</li></ul></article><article class="info-box"><h3>Cuidados de enfermagem</h3><ul><li>Registrar o volume e o horário imediatamente.</li><li>Utilizar sempre a unidade mL.</li><li>Conferir sondas, drenos e dispositivos.</li><li>Comunicar alterações importantes à equipe.</li></ul></article></div><div class="alert"><b>Atenção:</b> o saldo isolado não determina a condição clínica. A interpretação deve considerar prescrição, período avaliado, peso, sinais clínicos e condição do paciente.</div></section>`}
render();
</script>
</body>
</html>

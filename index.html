<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Balanço Hídrico UPA 24 Horas</title>
  <style>
    :root{--green:#009c4b;--blue:#087cc1;--red:#ed1c24;--ink:#064e73;--bg:#f3f8fb;--line:#d6e6ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;background:#fff;border-top:5px solid var(--green);border-bottom:1px solid var(--line)}header b{font:700 22px Georgia,serif}header small{display:block;color:#6b8290;margin-top:3px}.upa{font-size:28px;font-weight:900;color:var(--green)}.upa i{color:var(--blue);font-style:normal}.wrap{max-width:1150px;margin:auto;padding:26px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 7px 25px #154c6010;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1,.card h2{font-family:Georgia,serif;margin:2px 0}.head small{color:var(--green);font-weight:bold;text-transform:uppercase}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer}.new{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-top:16px;padding:14px;background:#edf7f2;border-radius:13px}input,select{width:100%;height:44px;padding:0 12px;border:1px solid #c9dadd;border-radius:10px;background:#fff;font:inherit}label{display:block;font-size:12px;font-weight:bold}label span{display:block;margin-bottom:6px}.patients{display:flex;gap:9px;overflow:auto;margin-top:15px}.patient{min-width:205px;text-align:left;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.patient.active{border:2px solid var(--green);background:#eef9f2}.patient small{display:block;color:#718793;margin-top:3px}.selected{display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff}.selected strong{font-family:Georgia,serif;font-size:18px}.selected span{margin-left:auto;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat small{display:block;color:#718793}.stat b{font-size:26px}.stat.balance{background:var(--blue);color:#fff}.workspace{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.tabs button{padding:11px;border:0;border-radius:9px;font-weight:bold}.tabs .on{background:#e4f6eb;color:var(--green)}.tabs .out.on{background:#ffeaeb;color:var(--red)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.records{max-height:390px;overflow:auto}.record{display:grid;grid-template-columns:1fr auto 25px;gap:10px;padding:12px 0;border-bottom:1px solid #e5eeee}.record small{display:block;color:#718793}.record .entrada{color:var(--green)}.record .saida{color:var(--red)}.record button{border:0;background:none;font-size:20px}.actions{display:flex;gap:7px}.danger{background:#ffeaeb;color:var(--red)}.empty{text-align:center;color:#718793;padding:55px 10px}.info p,.info li{color:#5f7680;line-height:1.6;font-size:13px}footer{text-align:center;color:#6b8290;font-size:11px;padding:20px;border-top:1px solid var(--line)}footer b{color:var(--blue)}@media(max-width:750px){.workspace{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}.new{grid-template-columns:1fr 1fr}.new button{grid-column:1/-1}}@media(max-width:440px){header b{font-size:17px}.upa{font-size:21px}.head{align-items:flex-start}.new{grid-template-columns:1fr}.new button{grid-column:auto}.row{grid-template-columns:1fr}.stats .stat b{font-size:20px}}
  </style>
</head>
<body>
<header><div><b>Balanço Hídrico UPA 24 Horas</b><small>Rondonópolis · Controle de entradas e saídas</small></div><div class="upa">UPA <i>24h</i></div></header>
<main class="wrap">
  <section class="card"><div class="head"><div><small>Pacientes internados</small><h1>Selecione o paciente</h1></div><button class="btn" onclick="toggleForm()">+ Novo paciente</button></div>
    <form class="new" id="newForm" onsubmit="addPatient(event)"><label><span>Nome do paciente</span><input id="name" required placeholder="Nome completo"></label><label><span>Leito</span><input id="bed" required placeholder="Ex.: 12A"></label><button class="btn">Adicionar paciente</button></form><div class="patients" id="patients"></div>
  </section>
  <div id="app"></div>
</main>
<footer>Feito por <b>Kathleen Gabrielly de Souza Estevão</b> · AC – Universidade Federal de Rondonópolis</footer>
<script>
let patients=JSON.parse(localStorage.getItem('balanco-pacientes')||'[]'),active=patients[0]?.id||null,type='entrada';
const cats={entrada:['Via oral','Soro/EV','Dieta enteral','Medicação','Outros'],saida:['Diurese','Dreno','Vômito','Fezes líquidas','Outros']};
const save=()=>localStorage.setItem('balanco-pacientes',JSON.stringify(patients));
function toggleForm(){const f=document.getElementById('newForm');f.style.display=f.style.display==='none'?'grid':'none'}
function addPatient(e){e.preventDefault();const p={id:Date.now(),nome:name.value.trim(),leito:bed.value.trim(),registros:[]};patients.push(p);active=p.id;name.value='';bed.value='';save();render()}
function selectPatient(id){active=id;render()}
function removePatient(){const p=current();if(!p||!confirm('Remover '+p.nome+' e todos os registros?'))return;patients=patients.filter(x=>x.id!==active);active=patients[0]?.id||null;save();render()}
function current(){return patients.find(p=>p.id===active)}
function setType(t){type=t;render()}
function addRecord(e){e.preventDefault();const p=current(),v=Number(document.getElementById('volume').value.replace(',','.'));if(!p||!v||v<=0)return;const time=document.getElementById('time').value,now=new Date(),parts=time.split(':');now.setHours(+parts[0],+parts[1],0,0);p.registros.unshift({id:Date.now(),dataHora:now.toISOString(),horario:time,tipo:type,categoria:document.getElementById('category').value,volume:v});save();render()}
function delRecord(id){const p=current();p.registros=p.registros.filter(r=>r.id!==id);save();render()}
function clearRecords(){if(confirm('Limpar todos os registros deste paciente?')){current().registros=[];save();render()}}
function download(){const p=current(),lim=Date.now()-43200000,rs=p.registros.filter(r=>new Date(r.dataHora).getTime()>=lim),en=rs.filter(r=>r.tipo==='entrada').reduce((s,r)=>s+r.volume,0),out=rs.filter(r=>r.tipo==='saida').reduce((s,r)=>s+r.volume,0);let rows=[['BALANÇO HÍDRICO UPA 24 HORAS'],['Paciente',p.nome,'Leito',p.leito],['Data','Horário','Tipo','Categoria','Volume (mL)'],...rs.slice().reverse().map(r=>[new Date(r.dataHora).toLocaleDateString('pt-BR'),r.horario,r.tipo,r.categoria,r.volume]),[],['Total entradas',en],['Total saídas',out],['Saldo',en-out]];let csv='\ufeff'+rows.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='balanco-12h-'+p.nome.replace(/\s+/g,'-')+'.csv';a.click()}
function render(){document.getElementById('patients').innerHTML=patients.map(p=>'<button class="patient '+(p.id===active?'active':'')+'" onclick="selectPatient('+p.id+')"><b>'+p.nome+'</b><small>Leito '+p.leito+' · '+p.registros.length+' registros</small></button>').join('');const p=current(),app=document.getElementById('app');if(!p){app.innerHTML='<div class="card empty">Cadastre o primeiro paciente para começar.</div>';return}const en=p.registros.filter(r=>r.tipo==='entrada').reduce((s,r)=>s+r.volume,0),out=p.registros.filter(r=>r.tipo==='saida').reduce((s,r)=>s+r.volume,0),bal=en-out,now=new Date().toTimeString().slice(0,5);app.innerHTML=`
<section class="card selected"><strong>${p.nome}</strong><span>Leito ${p.leito}</span><button class="btn danger" onclick="removePatient()">Remover</button></section>
<section class="stats"><div class="stat"><small>Entradas</small><b>${en.toLocaleString('pt-BR')} mL</b></div><div class="stat"><small>Saídas</small><b>${out.toLocaleString('pt-BR')} mL</b></div><div class="stat balance"><small>Saldo atual</small><b>${bal>0?'+':''}${bal.toLocaleString('pt-BR')} mL</b></div></section>
<section class="workspace"><form class="card" onsubmit="addRecord(event)"><h2>Novo registro</h2><label>Tipo</label><div class="tabs"><button type="button" class="${type==='entrada'?'on':''}" onclick="setType('entrada')">↓ Entrada</button><button type="button" class="out ${type==='saida'?'on':''}" onclick="setType('saida')">↑ Saída</button></div><label><span>Categoria</span><select id="category">${cats[type].map(x=>'<option>'+x+'</option>').join('')}</select></label><div class="row"><label><span>Volume (mL)</span><input id="volume" inputmode="decimal" required placeholder="Ex.: 500"></label><label><span>Horário</span><input id="time" type="time" value="${now}"></label></div><button class="btn" style="width:100%;margin-top:17px">Adicionar registro</button></form>
<section class="card"><div class="head"><div><h2>Registros de hoje</h2><small>${p.registros.length} lançamentos</small></div><div class="actions"><button class="btn" onclick="download()">Baixar 12h</button><button class="btn danger" onclick="clearRecords()">Limpar</button></div></div><div class="records">${p.registros.length?p.registros.map(r=>'<div class="record"><div><b>'+r.categoria+'</b><small>'+r.horario+'</small></div><b class="'+r.tipo+'">'+(r.tipo==='entrada'?'+':'−')+r.volume.toLocaleString('pt-BR')+' mL</b><button onclick="delRecord('+r.id+')">×</button></div>').join(''):'<div class="empty">Nenhum registro ainda.</div>'}</div></section></section>
<section class="card info"><h2>Entenda o balanço hídrico</h2><p>O balanço hídrico compara o volume de líquidos administrado com o volume eliminado. <b>Entradas − Saídas = Saldo hídrico.</b></p><ul><li>Entradas: via oral, soluções intravenosas, dietas e medicações.</li><li>Saídas: diurese, vômitos, drenagens e outras perdas mensuráveis.</li><li>A interpretação clínica deve ser realizada por profissional habilitado.</li></ul></section>`}
render();
</script>
</body>
</html>
